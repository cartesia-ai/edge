[build-system]
requires = [
  "setuptools>=42",
  "cmake>=3.25",
  "nanobind==2.4.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "cartesia-opencl"
version = "0.1.0"
description = "Cartesia OpenCL Extensions for State Space Models"
authors = [
    {name = "Cartesia AI", email = "contact@cartesia.ai"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21.0",
    "pyopencl>=2023.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["cartesia_opencl"]

[tool.setuptools.package-data]
cartesia_opencl = ["*.so", "*.dylib", "*.dll"]


